<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- background tile -->
  <rect width="64" height="64" rx="14" fill="#0e1014"/>
  <!-- spinning propellers -->
  <ellipse cx="14" cy="13" rx="11" ry="2.8" fill="#e8862a"/>
  <ellipse cx="50" cy="13" rx="11" ry="2.8" fill="#e8862a"/>
  <!-- motor masts -->
  <rect x="12.5" y="13" width="3" height="8" rx="1" fill="#f4f4f2"/>
  <rect x="48.5" y="13" width="3" height="8" rx="1" fill="#f4f4f2"/>
  <!-- frame arms + central hub -->
  <rect x="8" y="19.5" width="48" height="5" rx="2.5" fill="#f4f4f2"/>
  <rect x="23" y="16.5" width="18" height="10" rx="3.5" fill="#f4f4f2"/>
  <!-- manipulator arm -->
  <rect x="30" y="26" width="4" height="11" rx="1.5" fill="#e8862a"/>
  <!-- gripper fingers closing on the object -->
  <path d="M22.5 38.5h19M24 38.5v9.5l3.5 3M40 38.5v9.5l-3.5 3" fill="none" stroke="#f4f4f2" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- grasped object -->
  <rect x="27.2" y="42" width="9.6" height="10" rx="1.8" fill="#3b82f6"/>
</svg>
